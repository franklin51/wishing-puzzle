<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wishing Puzzle — Birthday Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="app">
        <header class="topbar">
            <h1>Wishing Puzzle</h1>
            <div class="progress" aria-live="polite">
                <span id="progressText">Candles: 0 / 27</span>
            </div>
        </header>

        <main class="stage">
            <!-- Canvas layer -->
            <canvas id="scene" width="1280" height="720" aria-label="Interactive birthday card"></canvas>
            <section id="capturePanel" class="capture-window hidden" aria-live="polite">
                <div class="preview">
                    <video id="video" autoplay playsinline muted></video>
                    <div class="capture-status">
                        <span class="status-dot"></span>
                        <span id="captureStatusText">等待吹蠟燭</span>
                    </div>
                </div>
                <div id="listeningIndicator" class="listening-indicator hidden">
                    <span class="label">正在聆聽願望</span>
                    <span class="sub">吹氣越大，蠟燭越快熄滅</span>
                    <div class="level" aria-hidden="true">
                        <div id="listeningLevelBar" class="level-bar"></div>
                    </div>
                </div>
                <button id="btnCloseCapture" class="btn subtle collapse">隱藏預覽</button>
            </section>
        </main>

        <footer class="bottombar">
            <button id="btnStart" class="btn primary">開始</button>
            <button id="btnNext" class="btn" disabled>下一步</button>
            <button id="btnReset" class="btn subtle">重置</button>
        </footer>

        <!-- Wishes panel (timed hint overlay) -->
        <section id="wishesPanel" class="overlay hidden" role="dialog" aria-modal="true" aria-live="polite">
            <div class="panel wish-hint">
                <h2>默念你的願望</h2>
                <p class="hint-text">請偷偷地為自己、為我們、為未來各許一個願望。</p>
                <div class="countdown" aria-hidden="true">
                    <span id="wishCountdown">5</span>
                </div>
                <button id="btnWishSkip" class="btn subtle skip">準備好了，開始吹蠟燭</button>
            </div>
        </section>

        <!-- Hidden canvas for export composition -->
        <canvas id="exportCanvas" class="hidden" width="2480" height="3508"></canvas>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
